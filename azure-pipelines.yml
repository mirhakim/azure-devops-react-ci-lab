trigger:
- develop

pool:
  name: Default   # Self-hosted Linux agent pool

stages:

# =========================================================
# STAGE 1: SOFTWARE COMPOSITION ANALYSIS
# =========================================================
- stage: SoftwareCompositionAnalysis
  displayName: Software Composition Analysis (Dependency Security)
  jobs:
  - job: DependencyVulnerabilityScan
    displayName: Dependency Vulnerability Scan (Retire.js)
    steps:
    - task: PowerShell@2
      displayName: Run Dependency Security Scan
      inputs:
        targetType: inline
        script: |
          npm install
          npx retire --exitwith 0

# =========================================================
# STAGE 2: CODE QUALITY & LINTING
# =========================================================
- stage: CodeQualityLinting
  displayName: Code Quality & Linting
  dependsOn: SoftwareCompositionAnalysis
  jobs:
  - job: MultiLanguageLinting
    displayName: Multi-Language Linting Checks
    steps:

    # ---------- JavaScript Linting (Biome) ----------
    - task: PowerShell@2
      displayName: JavaScript Linting (Biome)
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          npx @biomejs/biome lint . || $true

    # ---------- CSS Linting (Stylelint) ----------
    - task: PowerShell@2
      displayName: CSS Linting (Stylelint)
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          npx stylelint "**/*.css" || $true

    # ---------- YAML Linting (yamllint) ----------
    - task: PowerShell@2
      displayName: YAML Linting (yamllint)
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          python3 -m pip install --user yamllint
          $env:PATH = "$HOME/.local/bin:$env:PATH"
          yamllint . || $true

    # ---------- Markdown Linting (markdownlint) ----------
    - task: PowerShell@2
      displayName: Markdown Linting (markdownlint)
      continueOnError: true
      inputs:
        targetType: inline
        script: |
          npx markdownlint-cli "**/*.md" || $true

# =========================================================
# STAGE 3: BUILD & ARTIFACT PACKAGING
# =========================================================
- stage: BuildAndArtifactPackaging
  displayName: Build & Artifact Packaging
  dependsOn: CodeQualityLinting
  jobs:
  - job: BuildUI
    displayName: Application Build
    steps:
    - task: PowerShell@2
      displayName: Install Dependencies
      inputs:
        targetType: inline
        script: |
          npm install

    - task: PowerShell@2
      displayName: Build Application
      inputs:
        targetType: inline
        script: |
          npm run build

    - task: PublishBuildArtifacts@1
      displayName: Publish UI Build Artifact
      inputs:
        pathToPublish: build
        artifactName: todo-ui
